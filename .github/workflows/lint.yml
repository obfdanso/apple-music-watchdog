name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run PSScriptAnalyzer
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $results = Invoke-ScriptAnalyzer -Path src -Recurse -Settings PSScriptAnalyzerSettings.psd1
          $results | Format-Table -AutoSize
          if ($results) { exit 1 }

      - name: Compile C# helpers
        shell: powershell
        run: |
          Add-Type -Path src/AppAudio.cs
          Add-Type -Path src/WindowsShell.cs
          Add-Type -Path src/Waveform.cs -ReferencedAssemblies PresentationFramework, PresentationCore, WindowsBase, System.Xaml
